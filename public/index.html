<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/vendor/hljs.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <span class="logo">Brick</span>
  <div id="tabbar">
    <button id="tabs-collapse" title="Collapse or expand the tab bar" hidden>«</button>
    <nav id="tabs"></nav>
    <button id="new-tab" title="New tab (Alt+Shift+T)">+</button>
  </div>
  <span class="spacer"></span>
  <button id="appearance" title="Appearance: background, opacity, blur (Alt+Shift+G flips plain and picture)">Appearance</button>
  <button id="split-right" title="Split right (Alt+Shift+D)">Split right</button>
  <button id="split-down" title="Split down (Alt+Shift+S)">Split down</button>
</header>
<div id="main"><aside id="sidebar" hidden></aside><div id="stage"></div></div>
<div id="tray" hidden></div>
<div id="peek" hidden><div class="peek-title"></div><div class="peek-view"><div class="peek-scale"></div></div></div>
<aside id="appearance-panel" role="dialog" aria-label="Appearance" hidden>
  <div class="ap-head"><strong>Appearance</strong><button id="ap-close" title="Close (Esc)">×</button></div>
  <h3>Tabs</h3>
  <div class="seg" id="tab-pos" role="group" aria-label="Tab bar position">
    <button data-pos="top" title="Tabs along the top">Top</button>
    <button data-pos="left" title="Tabs down the left side">Left</button>
    <button data-pos="right" title="Tabs down the right side">Right</button>
  </div>
  <label class="row" id="tab-collapse-row"><span>Collapse</span><input id="tab-collapse" type="checkbox"><small>icons only, vertical bar</small></label>
  <h3>Apply to</h3>
  <div class="seg" id="scope" role="group" aria-label="Apply to">
    <button data-scope="tab" title="All panes in this tab">Whole tab</button>
    <button data-scope="pane" title="Only the pane you last clicked">Focused pane</button>
  </div>
  <p class="sub"><small id="ap-pane"></small> <button id="ap-pane-reset" hidden title="Make this pane follow its tab again">Follow tab</button></p>
  <h3>Background</h3>
  <div class="seg" id="bg-kind" role="group" aria-label="Background">
    <button data-bg="desktop" title="Your desktop wallpaper, fetched automatically">Desktop</button>
    <button data-bg="image" title="A picture from a file">Image</button>
    <button data-bg="capture" title="A screenshot of your screen right now">Capture</button>
    <button data-bg="solid" title="One colour">Solid</button>
    <button data-bg="blend" title="Soft blend of colours">Blend</button>
  </div>
  <div class="row" id="bg-picture" hidden><span id="bd-status"></span><span class="btns"><button id="bd-action"></button></span></div>
  <div class="row" id="bg-colors" hidden><span>Colour</span><span id="colors"></span></div>
  <input id="bd-input" type="file" accept="image/*" hidden>
  <p class="note" id="bd-msg" hidden></p>
  <label class="row"><span>Opacity</span><input id="opacity" type="range" min="15" max="100" step="1"><output id="opacity-out"></output></label>
  <label class="row"><span>Blur</span><input id="blur" type="range" min="0" max="30" step="1"><output id="blur-out"></output></label>
  <div class="row foot"><button id="ap-reset" title="Back to the plain dark look">Reset</button></div>
</aside>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/highlight.js"></script>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
